<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Employee | Nexora Workforce Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <div>
            <p class="eyebrow">NEXORA PEOPLE OPS</p>
            <h1>Workforce Dashboard</h1>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html">Employees</a>
            <a href="employee-registration.html" aria-current="page">Register Employee</a>
        </nav>
    </div>
</header>

<main>
    <section class="form-section">
        <h2 id="formTitle">Register Employee</h2>
        <p id="message" role="status" aria-live="polite"></p>

        <form id="employeeForm">
            <input type="hidden" id="employeeId">

            <div class="form-field">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" autocomplete="given-name" required>
            </div>

            <div class="form-field">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" autocomplete="family-name" required>
            </div>

            <div class="form-field">
                <label for="email">Email address</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>

            <div class="form-field">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" autocomplete="tel">
            </div>

            <div class="form-field">
                <label for="department">Department</label>
                <select id="department">
                    <option value="">No department</option>
                </select>
            </div>

            <div class="form-field">
                <label for="jobTitle">Job title</label>
                <input type="text" id="jobTitle">
            </div>

            <div class="form-field">
                <label for="salary">Salary</label>
                <input type="number" id="salary" min="0" step="0.01">
            </div>

            <div class="form-field">
                <label for="hireDate">Hire date</label>
                <input type="date" id="hireDate">
            </div>

            <div class="form-field">
                <label for="status">Status</label>
                <select id="status">
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitButton">Register Employee</button>
                <button type="button" id="cancelButton" hidden>Cancel</button>
                <a class="button secondary-button" href="index.html">View Employees</a>
            </div>
        </form>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
