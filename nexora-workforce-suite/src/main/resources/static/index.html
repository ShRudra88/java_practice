<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees | Nexora Workforce Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <div>
            <p class="eyebrow">NEXORA PEOPLE OPS</p>
            <h1>Workforce Dashboard</h1>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html" aria-current="page">Employees</a>
            <a href="employee-registration.html">Register Employee</a>
        </nav>
    </div>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <span class="card-label">Matching employees</span>
            <strong id="totalEmployees">0</strong>
        </div>
    </section>

    <section class="table-section">
        <h2>Employee Records</h2>

        <form id="employeeSearchForm" class="employee-search">
            <div class="filter-field">
                <label for="searchInput">Search name</label>
                <input type="search" id="searchInput"
                       placeholder="First name, last name, or full name">
            </div>

            <div class="filter-field">
                <label for="departmentFilter">Department</label>
                <select id="departmentFilter">
                    <option value="">All departments</option>
                </select>
            </div>

            <div class="filter-field page-size-field">
                <label for="pageSize">Rows per page</label>
                <select id="pageSize">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>

            <button type="submit">Search</button>
            <button type="button" id="clearFiltersButton">Clear Filters</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <p id="employeeSummary" aria-live="polite"></p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Job Title</th>
                        <th>Salary</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
            </table>
        </div>

        <div class="pagination-controls">
            <button type="button" id="previousPageButton">Previous</button>
            <span id="pageInfo" aria-live="polite">Page 0 of 0</span>
            <button type="button" id="nextPageButton">Next</button>
        </div>
    </section>

    <section id="transferSection" class="form-section" hidden>
        <h2>Transfer Employee</h2>
        <p id="transferEmployeeName"></p>
        <form id="transferForm">
            <input type="hidden" id="transferEmployeeId">

            <label for="transferDepartment">New Department</label>
            <select id="transferDepartment" required></select>

            <label for="transferEffectiveDate">Effective Date</label>
            <input type="date" id="transferEffectiveDate" required>

            <button type="submit">Record Transfer</button>
            <button type="button" id="cancelTransferButton">Cancel</button>
        </form>
    </section>

    <section id="historySection" hidden>
        <h2 id="historyTitle">Department History</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Effective Date</th>
                        <th>From Department</th>
                        <th>To Department</th>
                    </tr>
                </thead>
                <tbody id="departmentHistoryTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
