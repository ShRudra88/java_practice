
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora Workforce Suite</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Nexora Workforce Suite</h1>
    <p>Workforce Management Dashboard</p>
</header>

<main>

    <section class="dashboard">
        <div class="card">
            <h3>Total Employees</h3>
            <h2 id="totalEmployees">0</h2>
        </div>
    </section>

    <section class="form-section">
        <h2 id="formTitle">Add New Employee</h2>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <input type="text" id="firstName"
                   placeholder="First Name" required>

            <input type="text" id="lastName"
                   placeholder="Last Name" required>

            <input type="email" id="email"
                   placeholder="Email Address" required>

            <input type="text" id="phone"
                   placeholder="Phone Number">

            <input type="text" id="department"
                   placeholder="Department">

            <input type="text" id="jobTitle"
                   placeholder="Job Title">

            <input type="number" id="salary"
                   placeholder="Salary" min="0" step="0.01">

            <label for="hireDate">Hire Date</label>
            <input type="date" id="hireDate">

            <select id="status">
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
            </select>

            <button type="submit" id="submitButton">
                Add Employee
            </button>

            <button type="button" id="cancelButton"
                    onclick="resetForm()" hidden>
                Cancel Edit
            </button>

        </form>
    </section>

    <section class="table-section">

        <h2>Employee Records</h2>

        <input type="text" id="searchInput"
               placeholder="Search by first name">

        <button type="button" onclick="searchEmployees()">
            Search
        </button>

        <button type="button" onclick="loadEmployees()">
            Show All
        </button>

        <p id="message"></p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Job Title</th>
                        <th>Salary</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeTable"></tbody>
            </table>
        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
